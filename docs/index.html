<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KillerMudClient by Grzyboll — fork klienta MUD (develop)</title>
  <meta name="description" content="Fork klienta MUD KillerMudClient (oryginał: Laszlowaty), rozwijany na bieżąco na branchu develop — z mapą, automatami, buffami i pełnym wsparciem GMCP/MCCP.">
  <link rel="icon" href="assets/killer.ico">
  <style>
    :root {
      --bg: #14161d;
      --bg-panel: #1c1f29;
      --border: #333a4d;
      --gold: #d9b970;
      --gold-bright: #f0d492;
      --accent: #b45de0;
      --green: #5fbf77;
      --text: #d6d9e0;
      --text-dim: #8b91a3;
      --mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }
    a { color: var(--gold); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

    header {
      padding: 64px 0 56px;
      text-align: center;
      background:
        radial-gradient(ellipse 70% 50% at 50% -10%, #b45de022, transparent),
        radial-gradient(ellipse 60% 40% at 50% 0%, #d9b97014, transparent);
    }
    .logo { width: 96px; height: 96px; border-radius: 20px; box-shadow: 0 8px 40px #00000080; }
    h1 {
      margin-top: 20px;
      font-size: 2.6rem;
      color: var(--gold-bright);
      letter-spacing: 1px;
    }
    h1 .kill { color: var(--accent); }
    h1 .by {
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--text-dim);
      letter-spacing: normal;
    }
    .tagline { color: var(--text-dim); font-size: 1.15rem; max-width: 640px; margin: 12px auto 0; }

    .badges { margin-top: 18px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .badge {
      font-family: var(--mono); font-size: .8rem;
      background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 14px; color: var(--text-dim);
    }
    .badge b { color: var(--green); font-weight: 600; }

    .downloads { margin: 32px 0 8px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 26px; border-radius: 10px; text-decoration: none;
      font-weight: 600; font-size: 1rem; border: 1px solid transparent;
      transition: transform .1s ease, box-shadow .1s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--gold); color: #1a1408; box-shadow: 0 4px 24px #d9b97040; }
    .btn-secondary { background: var(--bg-panel); color: var(--text); border-color: var(--border); }
    .version-note { text-align: center; color: var(--text-dim); font-size: .85rem; font-family: var(--mono); }

    .invite { text-align: center; color: var(--text-dim); font-size: .95rem; max-width: 560px; margin: 28px auto 0; }
  </style>
</head>
<body>

<header>
  <div class="wrap">
    <img class="logo" src="assets/killer.png" alt="KillerMudClient logo">
    <h1><span class="kill">Killer</span>MudClient <span class="by">by Grzyboll 🍄 — wersja develop</span></h1>
    <p class="tagline">Fork klienta by <a href="https://laszlowaty.github.io/killer-mud-client/">Laszlowaty</a></p>
    <div class="badges">
      <span class="badge">Windows · Linux · macOS</span>
      <span class="badge">C# / Avalonia</span>
      <span class="badge"><b>open source</b> · MIT</span>
    </div>
    <div class="downloads">
      <a class="btn btn-primary" id="btn-download" href="https://github.com/Grzyboll/killer-mud-client/releases">⬇ Pobierz</a>
      <a class="btn btn-secondary" href="https://laszlowaty.github.io/killer-mud-client/">⬇ Pobierz wersję stabilną</a>
      <a class="btn btn-secondary" href="https://github.com/Grzyboll/killer-mud-client">GitHub</a>
      <a class="btn btn-secondary" href="changelog.html">Lista zmian</a>
    </div>
    <p class="version-note" id="version-note"></p>
    <p class="invite">Masz pomysł na nową funkcję albo trafiłeś na błąd? <a href="https://github.com/Grzyboll/killer-mud-client/discussions">Zgłoś go w Discussions</a> — każda opinia się liczy.</p>
  </div>
</header>

<script>
  // Publiczny manifest opisuje wyłącznie aplikację. Wydania mapy i Killeropedii
  // mają osobne tagi content-* i nie mogą wpływać na wersję pokazywaną na stronie.
  (async () => {
    const versionNote = document.getElementById('version-note');
    const downloadButton = document.getElementById('btn-download');
    const repository = 'https://github.com/Grzyboll/killer-mud-client';

    const showVersion = version => {
      const tag = 'v' + version;
      versionNote.textContent = 'Najnowsza wersja forka (develop): ' + tag;
      downloadButton.textContent = '⬇ Pobierz ' + tag;
      downloadButton.href = repository + '/releases/tag/' + tag;
    };

    try {
      // GitHub Pages serves this with Cache-Control: max-age=600 — force a fresh fetch so a
      // release that just went out doesn't sit stale in the browser's own HTTP cache too.
      const response = await fetch('app-version.json', { cache: 'no-store' });
      if (!response.ok) return;
      const manifest = await response.json();
      if (manifest.schemaVersion === 1
          && typeof manifest.version === 'string'
          && /^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(manifest.version)) {
        showVersion(manifest.version);
      }
    } catch {
      // Statyczny link do listy wydań pozostaje użytecznym fallbackiem.
    }
  })();
</script>

</body>
</html>
